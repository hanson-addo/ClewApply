version: 2
updates:
  # Keep third-party GitHub Actions patched. Add pip and npm entries
  # when backend/ and apps/ land.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright-core", "@axe-core/*"]
