version: 2
updates:
  # Keep third-party GitHub Actions patched. Actions are pinned to commit
  # SHAs, and Dependabot updates the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright-core", "@axe-core/*"]
