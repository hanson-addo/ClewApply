version: 2
# Lean mode (2026-11-04): one grouped pull request per folder each month, to keep
# review and CI runs down. Security fixes are separate from these version updates
# and still arrive as soon as an advisory is published.
updates:
  # Keep third-party GitHub Actions patched. Actions are pinned to commit
  # SHAs, and Dependabot updates the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      e2e:
        patterns: ["*"]
