name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action is free for personal-account repos. If this repo moves to a
      # GitHub organization, add a GITLEAKS_LICENSE secret or this step will fail.
      # With pull-requests: read it can't comment on a PR when it finds a leak;
      # the check still goes red, which is what blocks the merge.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
