name: Secret scan

# Every PR is scanned; merging to main doesn't re-run it (owner decision, 2026-11-22, to stay
# inside the free Actions minutes).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action is free for personal-account repos. If this repo moves to a
      # GitHub organization, add a GITLEAKS_LICENSE secret or this step will fail.
      # With pull-requests: read it can't comment on a PR when it finds a leak;
      # the check still goes red, which is what blocks the merge.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
