name: API

# Backend lint, types, migrations, tests and the OpenAPI spec.
# Runs only on pull requests that touch these paths, to stay inside the free Actions
# minutes (owner decision, 2026-11-22). Merging to main doesn't re-run it: the PR already did.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
      # Migrations and the test suite's setup run as the owner; the tests switch the API
      # itself to the clew_app role.
      CLEW_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations run up, down and up again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m clew.openapi > openapi.json
          git diff --exit-code -- openapi.json || (echo "Run: cd backend && uv run python -m clew.openapi > openapi.json" && exit 1)
