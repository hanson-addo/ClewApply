name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations run up, down and up again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m clew.openapi > openapi.json
          git diff --exit-code -- openapi.json || (echo "Run: cd backend && uv run python -m clew.openapi > openapi.json" && exit 1)

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types match the backend spec
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "Run: cd apps/web && npm run gen:api" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
      # Clerk development-instance keys for the signed-in specs. Only this repository's own
      # branches get them (never pull requests from forks); without them those specs skip.
      CLERK_PUBLISHABLE_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLERK_PUBLISHABLE_KEY || '' }}
      CLERK_SECRET_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLERK_SECRET_KEY || '' }}
      CLEW_CLERK_ISSUER: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLEW_CLERK_ISSUER || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: Install web app
        working-directory: apps/web
        run: npm ci
      - name: Install end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run typecheck
        working-directory: e2e
      - name: Say whether the signed-in specs will run
        # Prints only "set" or "missing", never a value.
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY CLEW_CLERK_ISSUER; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: missing"; fi
          done
          echo "Event: $GITHUB_EVENT_NAME, same-repo branch: $SAME_REPO"
          echo "Repository secret CLERK_SECRET_KEY exists: $HAS_REPO_SECRET"
        env:
          SAME_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          HAS_REPO_SECRET: ${{ secrets.CLERK_SECRET_KEY != '' }}
      - run: npm test
        working-directory: e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
