name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations run up, down and up again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m clew.openapi > openapi.json
          git diff --exit-code -- openapi.json || (echo "Run: cd backend && uv run python -m clew.openapi > openapi.json" && exit 1)

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types match the backend spec
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "Run: cd apps/web && npm run gen:api" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: Install web app
        working-directory: apps/web
        run: npm ci
      - name: Install end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run typecheck
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
