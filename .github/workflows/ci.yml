name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      CLEW_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
      # Migrations and the test suite's setup run as the owner; the tests switch the API
      # itself to the clew_app role.
      CLEW_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations run up, down and up again
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m clew.openapi > openapi.json
          git diff --exit-code -- openapi.json || (echo "Run: cd backend && uv run python -m clew.openapi > openapi.json" && exit 1)

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types match the backend spec
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "Run: cd apps/web && npm run gen:api" && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEW_ENV: test
      # The API runs as clew_app, as in production; migrations run as the owner.
      CLEW_DATABASE_URL: postgresql+asyncpg://clew_app:clew_app@localhost:5432/clew
      CLEW_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://clew:clew@localhost:5432/clew
      # File storage (MinIO) and the virus scanner (ClamAV) for the upload specs. CI-only
      # placeholder credentials; the containers start in the first step below.
      CLEW_S3_BUCKET: clew-resumes
      CLEW_S3_ENDPOINT_URL: http://localhost:9000
      CLEW_S3_REGION: us-east-1
      CLEW_S3_ACCESS_KEY_ID: clew-ci
      CLEW_S3_SECRET_ACCESS_KEY: clew-ci-only
      CLEW_CLAMAV_HOST: localhost
      CLEW_CLAMAV_PORT: "3310"
    steps:
      # Started first so ClamAV loads its signatures while the installs run. Both images are
      # for CI only, pinned by digest.
      # - ClamAV uses the signatures in the image and skips the online update, so runs are
      #   repeatable and stay off ClamAV's rate-limited mirrors. Frozen signatures are fine
      #   for testing the upload flow but don't meet production's freshness rule (R7).
      # - MinIO no longer publishes images on Docker Hub, so this is Bitnami's frozen build
      #   of the same MinIO release as docker-compose.yml. It gets no updates: never use it
      #   in production. It creates the private bucket on start.
      - name: Start file storage and the virus scanner
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$CLEW_S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$CLEW_S3_SECRET_ACCESS_KEY" \
            -e MINIO_DEFAULT_BUCKETS="$CLEW_S3_BUCKET" \
            bitnamilegacy/minio:2025.4.22-debian-12-r2@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
          docker run -d --name clamav -p 127.0.0.1:3310:3310 -e CLAMAV_NO_FRESHCLAMD=true \
            clamav/clamav:1.4@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Install API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: Let the app role log in (the migration creates it without a login)
        env:
          PGPASSWORD: clew
        run: psql -h localhost -U clew -d clew -c "ALTER ROLE clew_app LOGIN PASSWORD 'clew_app'"
      - name: Install web app
        working-directory: apps/web
        run: npm ci
      - name: Install end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run typecheck
        working-directory: e2e
      - name: Wait for file storage and the virus scanner
        run: |
          wait_for() { # seconds, then a command that succeeds once the service is ready
            local deadline=$((SECONDS + $1)); shift
            until "$@"; do
              if ((SECONDS >= deadline)); then echo "Timed out waiting for: $*"; exit 1; fi
              sleep 2
            done
          }
          bucket_is_private() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:9000/$CLEW_S3_BUCKET/")" = 403 ]
          }
          clamav_answers() { printf 'PING\n' | nc -w 2 localhost 3310 | grep -q PONG; }
          wait_for 120 curl -sf http://localhost:9000/minio/health/ready
          # The bucket exists (and is private) once an anonymous request gets 403, not 404.
          wait_for 60 bucket_is_private
          wait_for 300 clamav_answers
      - run: npm test
        working-directory: e2e
        env:
          # Clerk development-instance keys for the signed-in specs, given only to this step.
          # Only this repository's own branches get them (never pull requests from forks);
          # without them those specs skip.
          CLERK_PUBLISHABLE_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLERK_PUBLISHABLE_KEY || '' }}
          CLERK_SECRET_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLERK_SECRET_KEY || '' }}
          CLEW_CLERK_ISSUER: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLEW_CLERK_ISSUER || '' }}
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
