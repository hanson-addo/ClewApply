name: Security scan

# Dependency audits and static analysis on every PR (threat model R22, R23).
# All tools are free; CodeQL needs GitHub Advanced Security on private repos.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories against unchanged lock files still show up.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --no-emit-project -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  web-deps:
    name: JS dependencies (npm audit, ${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/web, e2e]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.dir }}/.nvmrc
      - name: Test the audit script
        run: node --test "$GITHUB_WORKSPACE/.github/scripts/npm-audit.test.mjs"
      # Fails on high or critical advisories, except those listed with a reason and an
      # expiry date in .github/npm-audit-exceptions.json (owner decision, 2026-11-17).
      - name: Audit the lock file (fails on high or critical)
        run: node "$GITHUB_WORKSPACE/.github/scripts/npm-audit.mjs"

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Scan with the security rule packs
        # INFO-level rules (style, i18n) are left out so only real risks block a PR.
        run: >-
          uvx semgrep@1.150.0 scan --metrics=off --error
          --severity WARNING --severity ERROR
          --config p/python --config p/typescript --config p/react
          --config p/secrets --config p/github-actions

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Lint .github/workflows (uses the runner's shellcheck for run steps)
        run: uvx --from actionlint-py@1.7.12.25 actionlint
