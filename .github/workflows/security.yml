name: Security scan

# Static analysis and workflow lint on every PR (threat model R23). Dependency audits are in
# deps-audit.yml. Merging to main doesn't re-run this: the PR already did (owner decision,
# 2026-11-22, to stay inside the free Actions minutes).
# All tools are free; CodeQL needs GitHub Advanced Security on private repos.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Scan with the security rule packs
        # INFO-level rules (style, i18n) are left out so only real risks block a PR.
        run: >-
          uvx semgrep@1.150.0 scan --metrics=off --error
          --severity WARNING --severity ERROR
          --config p/python --config p/typescript --config p/react
          --config p/secrets --config p/github-actions

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Lint .github/workflows (uses the runner's shellcheck for run steps)
        run: uvx --from actionlint-py@1.7.12.25 actionlint
