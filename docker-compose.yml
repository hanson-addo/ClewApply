# Local development: `docker compose up` runs everything (see the README).
# Credentials here are local-only placeholders; your own keys go in .env (see .env.example).

# Settings shared by the API and the worker. Inside Docker, services find each other by name.
x-backend-env: &backend-env
  CLEW_ENV: local
  CLEW_DATABASE_URL: postgresql+asyncpg://clew_app:clew_app@postgres:5432/clew
  CLEW_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://clew:clew@postgres:5432/clew
  CLEW_CORS_ORIGINS: '["http://localhost:5173"]'
  CLEW_CLERK_ISSUER: ${CLEW_CLERK_ISSUER:-}
  CLEW_S3_BUCKET: clew-resumes
  CLEW_S3_ENDPOINT_URL: http://minio:9000
  # Download links are opened by your browser, which reaches MinIO on localhost.
  CLEW_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  CLEW_S3_REGION: us-east-1
  CLEW_S3_ACCESS_KEY_ID: clew-local
  CLEW_S3_SECRET_ACCESS_KEY: clew-local-only
  CLEW_CLAMAV_HOST: clamav
  CLEW_CLAMAV_PORT: "3310"
  CLEW_REDIS_URL: redis://redis:6379/0
  CLEW_ANTHROPIC_API_KEY: ${CLEW_ANTHROPIC_API_KEY:-}
  CLEW_USAJOBS_API_KEY: ${CLEW_USAJOBS_API_KEY:-}
  CLEW_USAJOBS_EMAIL: ${CLEW_USAJOBS_EMAIL:-}

services:
  # The API on http://localhost:8000 (docs at /docs). It brings the database up to date first.
  api:
    build: { context: ., dockerfile: docker/dev/api.Dockerfile }
    command: sh -c "alembic upgrade head && uvicorn clew.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 100
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
      clamav: { condition: service_started }

  # Reads resumes and fetches jobs in the background.
  worker:
    build: { context: ., dockerfile: docker/dev/api.Dockerfile }
    command: arq clew.worker.WorkerSettings
    environment: *backend-env
    volumes:
      - ./backend:/app/backend
    depends_on:
      api: { condition: service_healthy }

  # The web app on http://localhost:5173.
  web:
    build: { context: ., dockerfile: docker/dev/web.Dockerfile }
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      # Keeps the image's installed packages instead of any node_modules in your checkout.
      - /app/apps/web/node_modules
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clew-pg:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew -d clew"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for resume files, with the private resume bucket created on start.
  # MinIO no longer publishes images on Docker Hub, so this is Bitnami's frozen build of the
  # same release (local development only, never production). Console: http://localhost:9001
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r2@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
    environment:
      MINIO_ROOT_USER: clew-local
      MINIO_ROOT_PASSWORD: clew-local-only
      MINIO_DEFAULT_BUCKETS: clew-resumes
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - clew-minio:/bitnami/minio/data

  # Virus scanner for uploads. The first start downloads virus signatures, which takes a few
  # minutes; uploads answer 503 until it's ready.
  clamav:
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clew-clamav:/var/lib/clamav

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  clew-pg:
  clew-minio:
  clew-clamav:
