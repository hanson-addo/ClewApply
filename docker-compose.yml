# Local development services. Credentials here are local-only placeholders.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clew-pg:/var/lib/postgresql/data

  # S3-compatible storage for resume files. Console: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clew-local
      MINIO_ROOT_PASSWORD: clew-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - clew-minio:/data

  # Creates the private resume bucket once MinIO is up, then exits.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 clew-local clew-local-only; do sleep 1; done;
      mc mb --ignore-existing local/clew-resumes;
      mc anonymous set none local/clew-resumes
      "

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  clew-pg:
  clew-minio:
