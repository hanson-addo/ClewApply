# Local development services. Credentials here are local-only placeholders.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clew
      POSTGRES_PASSWORD: clew
      POSTGRES_DB: clew
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clew-pg:/var/lib/postgresql/data

volumes:
  clew-pg:
