[project]
name = "clew"
version = "0.1.0"
description = "Clew API: one profile and one job feed for every job site."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.29",
    "alembic>=1.20.1",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.27",
    "boto3>=1.44.3",
    "python-multipart>=0.0.33",
    "pypdf==7.1.0",  # pinned: parses hostile files (Security on #12)
    "defusedxml>=0.7.1",
    "arq>=0.28.0",
    "anthropic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "httpx>=0.27",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.9",
    "boto3-stubs[s3]>=1.44.3",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clew"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
