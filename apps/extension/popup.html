<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clew</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main id="popup" class="popup" aria-live="polite">
      <h1 class="popup-title">Clew</h1>
      <p id="status" class="popup-status">Checking…</p>
      <dl id="facts" class="popup-facts" hidden>
        <dt>Signed in as</dt>
        <dd id="email"></dd>
        <dt>Profile</dt>
        <dd id="profile"></dd>
      </dl>
      <section id="site" class="popup-site" aria-labelledby="site-name" hidden>
        <h2 id="site-name" class="popup-site-name">LinkedIn</h2>
        <p id="site-text" class="popup-hint"></p>
        <button id="site-fill" type="button" class="popup-button popup-button-primary" hidden>Fill this LinkedIn form</button>
        <button id="site-on" type="button" class="popup-button" hidden>Turn on LinkedIn</button>
        <p id="site-result" class="popup-result" role="status"></p>
        <button id="site-off" type="button" class="popup-link" hidden>Turn off LinkedIn</button>
      </section>
      <p id="hint" class="popup-hint" hidden></p>
      <button id="sign-out" type="button" class="popup-button" hidden>Sign out of the extension</button>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
