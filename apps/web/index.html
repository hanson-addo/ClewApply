<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Feed filters live in the address; never send more than the origin to outside sites. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="One profile and one job feed for every site you job hunt on." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Clew</title>
  </head>
  <body>
    <!-- Replaced as soon as the app starts. If it stays, the app's code didn't load. -->
    <div id="root">
      <p style="font-family: sans-serif; padding: 2rem; color: #101935; background: #f4f2ff">
        Loading Clew… If this stays, reload. Still stuck? Run <code>docker compose logs web</code>
        to see why.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
